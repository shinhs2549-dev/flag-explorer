<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E4F3FA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="국기 탐험대">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;touch-action:manipulation;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>국기 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen app — top bar, question row with flag, then map or big answer buttons. Paper-map world, single bright theme by choice. */
:root{
  --sky:#E4F3FA; --sea:#BCDDEE; --land:#E7E1C9; --border:#B9AF8E;
  --ink:#1F2B4D; --ink-soft:#56607F; --card:#FFFFFF; --line:#D5E3EC;
  --sun:#FFC23D; --good:#2FA866; --muted:#C9CED8;
  --o1:#F2604E; --o2:#2F7BEA; --o3:#1E9E5A; --o4:#9B5DE5;
  --display:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:17px;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:12px 24px;min-height:100%;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
button{font-family:var(--display);color:var(--ink);cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--o2);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;min-height:52px}
.bar .grow{flex:1;min-width:0}
.title{font-size:30px;letter-spacing:.02em}
.title small{display:block;font-family:var(--body);font-size:13px;color:var(--ink-soft);letter-spacing:.08em}
.stars{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 14px;font-family:var(--display);font-size:22px;box-shadow:0 2px 0 var(--line);font-variant-numeric:tabular-nums}
.stars svg{width:24px;height:24px}
.icon-btn{width:52px;height:52px;border-radius:16px;background:var(--card);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;flex:none}
.icon-btn svg{width:26px;height:26px}
.gear{opacity:.45;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.gear svg{pointer-events:none}
.gear.holding{opacity:1;animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(.9)}}

/* home */
.home-grid{display:grid;grid-template-columns:minmax(0,350px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:700px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:14px;min-width:0}
.avatar-frame{aspect-ratio:1/1;max-width:100%;border-radius:18px;background:repeating-linear-gradient(45deg,var(--sky) 0 14px,#EEF8FC 14px 28px);display:grid;place-items:center;overflow:hidden;position:relative}
.avatar-frame img{width:100%;height:100%;object-fit:contain}
.stage-box{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:18px;overflow:hidden;touch-action:none;
  background:radial-gradient(120% 70% at 50% 100%,#FFF4D6 0 34%,transparent 35%),linear-gradient(#CDEBF7,#EAF6FB 70%)}
.stage-box .char{position:absolute;left:50%;bottom:0;height:94%;transform:translateX(-50%);pointer-events:none;z-index:2}
.stage-box .avatar-empty{position:absolute;inset:0;display:grid;place-content:center;z-index:2}
.sticker{position:absolute;transform:translate(-50%,-50%);z-index:3;cursor:grab;touch-action:none;-webkit-user-drag:none;filter:drop-shadow(0 2px 2px rgba(31,43,77,.18))}
.sticker.back{z-index:1}
.sticker.sel{outline:3px dashed var(--o2);outline-offset:4px;border-radius:8px}
.sticker.drag{cursor:grabbing;filter:drop-shadow(0 8px 8px rgba(31,43,77,.3))}
.sel-bar{display:flex;gap:8px;justify-content:center}
.sel-bar button{font-size:18px;border-radius:12px;padding:8px 14px;background:var(--sky);box-shadow:0 3px 0 var(--line)}
.sel-bar #unstick{background:#FDE3DF;color:#A3271A}
.tray-head{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--ink-soft)}
.shop-btn{display:flex;align-items:center;gap:4px;font-size:20px;background:var(--sun);border-radius:999px;padding:6px 14px;box-shadow:0 3px 0 #D69A12}
.shop-btn svg{width:20px;height:20px}
.tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tray button{aspect-ratio:1/1;border-radius:12px;background:var(--sky);padding:6px;display:grid;place-items:center}
.tray button img{max-width:100%;max-height:100%;object-fit:contain}
.tray button.on{background:#FFF0C2;box-shadow:inset 0 0 0 2px var(--sun)}
.tray .note{grid-column:1/-1}
.shop{width:min(620px,100%)!important}
.shop-head{display:flex;justify-content:space-between;align-items:center}
.shop-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:480px){.shop-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.shop-item{border-radius:16px;background:var(--sky);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;box-shadow:0 3px 0 var(--line)}
.shop-item img{width:72%;aspect-ratio:1/1;object-fit:contain}
.shop-item small{display:flex;align-items:center;gap:2px;font-family:var(--display);font-size:17px}
.shop-item small svg{width:18px;height:18px}
.shop-item small.short{opacity:.5}
.shop-item.have{background:#E5F5EC;box-shadow:none}
.shop-item.have small{font-family:var(--body);font-size:12px;color:var(--good)}
.avatar-empty{text-align:center;color:var(--ink-soft);font-size:15px;padding:12px}
.avatar-empty b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--ink);margin-bottom:4px}
.styles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.styles.scroll{display:flex;overflow-x:auto;gap:8px;align-items:center;padding-bottom:4px}
.styles.scroll .style-chip{flex:none;min-width:72px;padding:10px 12px}
.style-more{flex:none;font-size:12px;color:var(--ink-soft);padding:0 6px}
.style-chip{border-radius:14px;padding:10px 4px;background:var(--sky);font-size:16px;display:flex;flex-direction:column;align-items:center;gap:2px}
.style-chip small{font-family:var(--body);font-size:11px;color:var(--ink-soft)}
.style-chip.on{background:var(--sun)}
.style-chip:disabled{opacity:.45;cursor:default}
.level-head{display:flex;align-items:baseline;gap:10px}
.level-badge{font-family:var(--display);font-size:22px;background:var(--ink);color:#fff;border-radius:12px;padding:2px 12px}
.level-head p{margin:0;color:var(--ink-soft);font-size:14px}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:420px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stage{border-radius:18px;padding:12px 8px 10px;background:var(--sky);display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.stage:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.stage .num{font-size:22px}
.stage .flags{display:flex;gap:3px}
.stage .flags img{width:22px;height:16.5px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.stage .meta{font-family:var(--body);font-size:12px;color:var(--ink-soft)}
.stage.done{background:#E5F5EC}
.stage.done .meta{color:var(--good)}
.stage:disabled{opacity:.4;cursor:default;box-shadow:none}
.test-btn{border-radius:20px;padding:16px;background:var(--sun);font-size:26px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 5px 0 #D69A12}
.test-btn small{font-family:var(--body);font-size:14px}
.test-btn:disabled{background:var(--muted);box-shadow:0 5px 0 #AEB4C0;cursor:default}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tier{border-radius:16px;padding:10px 4px;background:var(--sky);display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 0 var(--line)}
.tier .tstars{display:flex;gap:1px}
.tier .tstars svg{width:22px;height:22px}
.tier small{font-family:var(--body);font-size:12px;color:var(--ink-soft)}
.tier.on{background:var(--ink);box-shadow:0 3px 0 #0E1630}
.tier.on small{color:#fff}
.tier.done:not(.on) small{color:var(--good)}
.tier:disabled{opacity:.4;cursor:default;box-shadow:none}
.tier:disabled .tstars svg{filter:grayscale(1)}
.play-btn{border-radius:22px;padding:18px;background:var(--o2);color:#fff;font-size:34px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 #1D57B0}
.play-btn small{font-family:var(--body);font-size:15px;opacity:.9}
.play-btn:active,.test-btn:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.collect-head{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--ink-soft)}
.collect-head b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.collect{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.collect button{position:relative;padding:0;border-radius:8px;aspect-ratio:4/3;overflow:visible}
.collect img{width:100%;height:100%;display:block;border-radius:7px;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.collect .new img{filter:grayscale(1) brightness(1.15);opacity:.35}
.collect i{position:absolute;right:-6px;top:-7px;width:20px;height:20px}
.collect i svg{width:100%;height:100%}
.collect-head small{font-size:12px}
.need-note{display:block}
.nowrap{white-space:nowrap}
.flag-q{position:relative;align-self:center;background:var(--card);border-radius:24px;padding:16px;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;gap:14px}
.flag-q img{height:clamp(110px,24vw,190px);width:auto;border-radius:10px;box-shadow:0 0 0 1px rgba(0,0,0,.1),0 8px 20px rgba(31,43,77,.14)}
.q-line{text-align:center;font-size:clamp(24px,5vw,32px)}
.treasure .eyebrow{font-family:var(--display);font-size:clamp(26px,6vw,38px);color:var(--o1)}
.tcard{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border-radius:18px;padding:10px;box-shadow:0 0 0 3px var(--tc,var(--sun)),0 6px 0 var(--line);min-width:0}
.tcard.t1{--tc:#FFC23D}.tcard.t2{--tc:#7FB8FF}.tcard.t3{--tc:#C89BFF}
.tcard .tpic{width:100%;aspect-ratio:1/1;border-radius:12px;background:var(--sky);display:grid;place-items:center;overflow:hidden;position:relative}
.tcard .tpic img{width:100%;height:100%;object-fit:contain}
.tcard .tpic .tflag{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28}
.tcard .tpic span{position:relative;font-family:var(--display);font-size:clamp(14px,3vw,20px);padding:6px;text-align:center;overflow-wrap:anywhere}
.tcard .tname{font-family:var(--display);font-size:16px;text-align:center;overflow-wrap:anywhere}
.tcard .tkind{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-soft);text-align:center}
.tcard .tkind img{width:16px;border-radius:2px}
.tcard.big{width:min(300px,80%);padding:16px;gap:10px}
.tcard.big .tname{font-size:clamp(30px,7vw,42px)}
.tcard.big .tkind{font-size:16px}
.tcard.big .tkind img{width:26px}
.tcard.big .tpic span{font-size:clamp(28px,7vw,40px)}
@media (prefers-reduced-motion:no-preference){.treasure .tcard.big{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.book{width:min(640px,100%)!important}
.book-count{font-family:var(--display);font-weight:400;font-size:22px}
.book-grid{display:flex;flex-direction:column;gap:8px}
.book-row{display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr));gap:8px;align-items:center}
.bflag{width:44px;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.bslot{padding:0;border-radius:14px;min-width:0}
.bslot .tcard{padding:6px;gap:3px}
.bslot .tcard .tkind{display:none}
.bslot .tcard .tname{font-size:13px}
.bslot .tcard .tpic span{font-size:12px}
.bslot.empty{aspect-ratio:1/1.18;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:26px;color:var(--muted)}
.bslot.empty span{font-size:12px}
/* 보물 카드 설명 */
.desc{width:min(340px,92%);background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 4px 0 var(--line);position:relative}
.desc::before{content:"";position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--card)}
.desc p{margin:0;font-size:clamp(17px,4vw,21px);line-height:1.6;text-align:center;text-wrap:pretty}
.desc.pop{animation:descIn .35s ease-out}
@keyframes descIn{from{opacity:0;transform:translateY(-8px)}}
.tap-hint{margin:0;font-size:14px;color:var(--ink-soft)}
.flip.still .flip-inner{transition:none}
.flip.still .face.back{animation:none}
.reveal-box .desc{width:100%;box-sizing:border-box}
/* 보물 카드 뒤집기 */
.flip{position:relative;width:min(300px,80%);aspect-ratio:3/4.3;padding:0;perspective:1200px;cursor:pointer}
.flip-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.flip.open .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.face.front{transform:rotateY(180deg)}
.face.front .tcard.big{width:100%;height:100%;box-sizing:border-box;justify-content:center}
.face.back,.bslot.shut{flex-direction:column;gap:6px;border-radius:20px;color:#fff;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35) 0 8%,transparent 9%),radial-gradient(circle at 75% 70%,rgba(255,255,255,.25) 0 6%,transparent 7%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 10px,transparent 10px 20px),linear-gradient(150deg,var(--bc1),var(--bc2));
  box-shadow:0 0 0 4px #fff,0 0 0 7px var(--bc1),0 8px 0 7px var(--line)}
.t1{--bc1:#FFB627;--bc2:#FF7A45}.t2{--bc1:#4D9BFF;--bc2:#2F5FD0}.t3{--bc1:#B07BFF;--bc2:#6A3FD1}
.face.back .bstars{font-size:30px;letter-spacing:4px;color:#FFE27A}
.face.back .bq{font-family:var(--display);font-size:110px;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.15)}
.face.back .bhint{font-family:var(--display);font-size:20px;opacity:.9}
.light{position:absolute;inset:-40%;border-radius:50%;pointer-events:none;opacity:0;z-index:5;
  background:radial-gradient(circle,#fff 0 18%,rgba(255,244,190,.9) 30%,rgba(255,230,140,.45) 48%,transparent 68%)}
.flip.glow .light{animation:shine 1.5s ease-out forwards}
.flip.glow:not(.open) .face.back{animation:shake .9s ease-in-out}
@keyframes shine{0%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(1)}70%{opacity:.9;transform:scale(1.15)}100%{opacity:0;transform:scale(1.4)}}
@keyframes shake{0%,100%{transform:none}20%{transform:rotate(-4deg) scale(1.03)}40%{transform:rotate(4deg) scale(1.06)}60%{transform:rotate(-3deg) scale(1.08)}80%{transform:rotate(2deg) scale(1.1)}}
.flip:not(.glow) .face.back{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.flip-inner{transition:none}.flip .light,.flip .face.back{animation:none!important}}
.reveal{background:rgba(31,43,77,.7)}
.reveal-box{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(360px,100%)}
.bslot.shut{aspect-ratio:1/1.18;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--bc1);gap:0;animation:bob 2.2s ease-in-out infinite}
.bslot.shut .bstars{font-size:11px;color:#FFE27A}
.bslot.shut .bq{font-family:var(--display);font-size:30px;line-height:1}
.bslot.shut .bhint{font-family:var(--display);font-size:12px}
.shop-btn{position:relative}
.shop-btn .dot{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--o1);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center;padding:0 4px}
.shop-head{gap:8px}
.shop-head h3{flex:1;min-width:0}
.shop-head.sticky{position:sticky;top:-18px;margin:-18px -18px 0;padding:14px 18px 10px;background:var(--card);z-index:3;border-radius:22px 22px 0 0}
.x-btn{width:44px;height:44px;border-radius:50%;background:var(--sky);display:grid;place-items:center;flex:none}
.x-btn svg{width:22px;height:22px}
.x-float{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:var(--card);box-shadow:0 3px 0 var(--line);z-index:61}
.speak.sm{width:44px;height:44px;box-shadow:0 2px 0 #D69A12}
.speak.sm svg{width:22px;height:22px}
.country{width:min(560px,100%)!important}
.c-top{display:flex;align-items:center;gap:16px}
.c-flag{width:min(42%,190px);border-radius:10px;box-shadow:0 0 0 1px rgba(0,0,0,.1),0 6px 16px rgba(31,43,77,.12)}
.c-facts{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.c-facts div{display:flex;gap:10px;align-items:baseline}
.c-facts dt{font-size:13px;color:var(--ink-soft);flex:none}
.c-facts dd{margin:0;font-family:var(--display);font-size:clamp(20px,4.5vw,26px);overflow-wrap:anywhere}
.country .map-wrap .opt{cursor:default}
.c-about{margin:0;font-size:clamp(17px,4vw,20px);line-height:1.65;text-wrap:pretty}
.c-treasure{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.level-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ltab{border-radius:14px;padding:8px 4px;background:var(--sky);display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 3px 0 var(--line)}
.ltab b{font-family:var(--display);font-weight:400;font-size:24px}
.ltab small{font-family:var(--body);font-size:11px;color:var(--ink-soft)}
.ltab.on{background:var(--sun);box-shadow:0 3px 0 #D69A12}
.ltab.on small{color:var(--ink)}
.ltab:disabled{opacity:.45;box-shadow:none;cursor:default}
.collect.many{grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
@media (max-width:480px){.collect.many{grid-template-columns:repeat(6,minmax(0,1fr))}}
.locked-levels{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* ===== 우리 마을 ===== */
.village-btn{border-radius:22px;padding:14px;background:var(--o3);color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 #157544;white-space:nowrap}
.village-btn b{font-family:var(--display);font-weight:400;font-size:30px}
.village-btn small{font-family:var(--body);font-size:14px;opacity:.92}
.village-btn:active{transform:translateY(4px);box-shadow:none}
#app.vmode{max-width:none;padding:0;height:100%;min-height:0;gap:0}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--sky);position:relative;z-index:5}
.vtitle{flex:1;min-width:0;font-size:26px;white-space:nowrap;overflow:hidden}
@media (max-width:420px){.vtitle{font-size:0}.vdecor-btn{padding:10px 14px}}
.vdecor-btn{font-size:20px;border-radius:999px;padding:10px 18px;background:var(--o3);color:#fff;box-shadow:0 4px 0 #157544;white-space:nowrap;flex:none}
.vdecor-btn.on{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #D69A12}

Object.assign(DESC, {
  tw:['쫀득쫀득한 동그란 알갱이가 들어 있는 달콤한 밀크티예요. 굵은 빨대로 쭉 마셔요.','종이로 만든 등에 소원을 써서 하늘로 날려 보내요.','대나무처럼 마디가 있는 아주 높은 빌딩이에요.'],
  sg:['매콤달콤한 소스에 커다란 게를 넣고 볶은 음식이에요.','머리는 사자, 몸은 물고기인 싱가포르의 상징이에요. 입에서 물을 뿜어요.','빌딩 세 개 꼭대기에 배 모양 정원이 얹혀 있는 호텔이에요.'],
  ph:['곱게 간 얼음 위에 과일, 콩, 아이스크림을 듬뿍 올린 빙수예요.','알록달록 꾸민 버스예요. 사람들이 타고 다니는 필리핀의 대표 탈것이에요.','작고 둥근 언덕이 천 개도 넘게 모여 있어요. 마른 계절에 갈색으로 변해서 초콜릿처럼 보여요.'],
  my:['코코넛 물로 지은 밥에 멸치, 땅콩, 달걀, 매콤한 소스를 곁들여 먹어요.','숲속 나무 위에서 사는 털이 빨간 유인원이에요. 말레이어로 숲의 사람이라는 뜻이에요.','쌍둥이처럼 똑같이 생긴 두 빌딩이 다리로 이어져 있어요.'],
  mn:['고기를 넣고 기름에 튀긴 납작한 만두예요.','초원을 옮겨 다니며 사는 사람들이 쓰는 둥근 천막집이에요. 쉽게 접고 펼 수 있어요.','아주 넓은 사막이에요. 옛날 공룡 화석과 알이 많이 발견됐어요.'],
  kz:['삶은 고기와 넓적한 국수를 큰 접시에 담아 다 함께 먹는 음식이에요.','커다란 독수리예요. 사람과 함께 사냥을 하도록 길러요.','하얀 기둥 위에 금빛 공이 올려진 탑이에요. 나무 위에 놓인 황금알 옛이야기를 나타내요.'],
  uz:['쌀에 고기, 당근, 양파를 넣고 큰 솥에 지은 기름진 밥이에요.','파란색과 하늘색 무늬를 그려 구운 도자기예요.','파란 지붕이 있는 커다란 건물 세 채가 광장을 둘러싸고 있어요. 옛날 비단길의 도시에 있어요.'],
  ir:['꽃에서 얻은 귀한 향신료 사프란으로 노랗게 물들인 밥이에요.','실을 하나하나 묶어서 무늬를 넣어 짠 양탄자예요. 아주 오래 걸려서 만들어요.','아주 옛날 페르시아 왕들이 세운 궁전 터예요. 돌기둥과 조각이 남아 있어요.'],
  iq:['큰 강에서 잡은 생선을 반으로 갈라 불 옆에 세워서 구운 음식이에요.','달콤한 대추야자 열매가 열리는 나무예요. 더운 곳에서 잘 자라요.','아주 옛날 사람들이 벽돌로 계단처럼 높이 쌓은 신전이에요.'],
  qa:['밀과 고기를 오래 끓여서 죽처럼 부드럽게 만든 음식이에요.','길고 곧은 뿔이 두 개 있는 하얀 영양이에요. 사막에 살아요.','2022년 월드컵 결승전이 열린 커다란 축구 경기장이에요.'],
  jo:['양고기를 요구르트 소스에 끓여 밥 위에 얹은 음식이에요. 손님을 대접할 때 먹어요.','물이 아주 짜서 사람 몸이 둥둥 뜨는 호수예요. 땅에서 가장 낮은 곳에 있어요.','분홍빛 바위산을 깎아서 만든 옛날 도시예요.'],
  il:['병아리콩을 갈아 동그랗게 빚어 튀긴 음식이에요. 빵에 넣어 먹어요.','바닷가 항구 도시 자파의 이름이 붙은 달콤한 오렌지예요.','사막 한가운데 높은 바위산 위에 있는 옛날 요새예요.'],
  pk:['향신료를 넣고 고기와 함께 지은 노란 쌀 요리예요.','트럭을 꽃과 새, 반짝이 장식으로 화려하게 꾸며요. 달리는 그림 같아요.','세계에서 두 번째로 높은 산이에요. 오르기가 아주 어려워요.'],
  bd:['힐사라는 생선을 매콤한 소스에 익힌 음식이에요. 방글라데시 사람들이 아주 좋아하는 생선이에요.','줄무늬가 있는 큰 호랑이예요. 방글라데시를 상징하는 동물이에요.','바닷물과 강물이 만나는 곳에 있는 큰 숲이에요. 호랑이가 살아요.'],
  lk:['스리랑카의 옛 이름 실론에서 이름을 딴 홍차예요. 산비탈 차밭에서 찻잎을 따요.','점무늬가 있는 날쌘 고양잇과 동물이에요.','커다란 바위 꼭대기에 옛날 왕궁이 있었어요. 사자 발 모양 입구가 있어요.'],
  np:['반달이나 동그란 모양의 만두예요. 매콤한 소스에 찍어 먹어요.','털이 길고 북실북실한 소예요. 추운 높은 산에서 짐을 날라 줘요.','세상에서 가장 높은 산이에요. 네팔과 중국 사이에 있어요.'],
  kh:['생선을 코코넛 크림과 향신료에 버무려 바나나 잎에 싸서 찐 음식이에요.','반짝이는 장식과 뾰족한 왕관을 쓰고 우아하게 추는 전통 춤의 옷이에요.','아주 옛날에 돌로 지은 커다란 사원이에요. 캄보디아 국기에도 그려져 있어요.'],
  la:['쫀득한 찹쌀로 지은 밥이에요. 손으로 조금씩 뭉쳐서 먹어요.','허리에 두르는 긴 치마예요. 끝단에 예쁜 무늬를 수놓아요.','하늘빛 물이 계단처럼 층층이 흘러내리는 폭포예요.'],
  mm:['생선 국물에 쌀국수를 말아 먹는 음식이에요. 아침에 많이 먹어요.','허리에 감아 입는 긴 치마 같은 옷이에요. 남자도 여자도 입어요.','금으로 덮인 아주 높고 뾰족한 탑이에요. 햇빛에 반짝반짝 빛나요.'],
  be:['격자무늬가 있는 바삭하고 폭신한 과자 빵이에요.','벨기에는 맛있는 초콜릿으로 아주 유명해요.','커다란 쇠 공 아홉 개가 이어진 건물이에요. 아주 작은 알갱이를 크게 키운 모양이에요.'],
  at:['초콜릿 케이크 사이에 살구잼을 바른 달콤한 케이크예요.','오스트리아는 음악의 나라예요. 모차르트도 오스트리아에서 태어났어요.','옛날 왕족이 살던 노란색 궁전이에요. 넓은 정원이 있어요.'],
  ie:['양고기와 감자, 당근을 넣고 푹 끓인 스튜예요.','잎이 세 장인 클로버예요. 아일랜드를 상징해요.','바다 위로 높이 솟은 절벽이에요. 바닷새가 많이 살아요.'],
  dk:['얇은 빵 위에 생선이나 달걀, 채소를 예쁘게 올린 오픈 샌드위치예요.','동화 작가 안데르센의 인어공주 이야기에서 나온 작은 동상이에요.','알록달록한 집들이 운하를 따라 줄지어 있는 항구예요.'],
  fi:['계피와 설탕을 돌돌 말아 구운 빵이에요.','큰 뿔이 있는 사슴이에요. 썰매를 끌기도 해요.','산타클로스를 만날 수 있는 마을이에요. 북극권 선 위에 있어요.'],
  pt:['바삭한 껍질 안에 달콤하고 부드러운 크림이 들어 있는 작은 타르트예요.','하얀 바탕에 파란 그림을 그린 타일이에요. 건물 벽을 예쁘게 꾸며요.','바닷가에 서 있는 하얀 탑이에요. 옛날 배들이 떠나던 곳을 지켰어요.'],
  gr:['고기를 꼬챙이에 꽂아 구운 음식이에요. 빵에 싸서 먹기도 해요.','올리브 열매가 열리는 나무예요. 열매로 기름도 만들어요.','언덕 위에 하얀 돌기둥이 줄지어 서 있는 아주 오래된 신전이에요.'],
  cz:['반죽을 막대에 돌돌 감아 구운 굴뚝 모양 빵이에요. 설탕을 뿌려 먹어요.','줄을 매달아 움직이는 인형이에요. 인형극을 해요.','오래된 시계탑이에요. 정각이 되면 작은 인형들이 나와서 움직여요.'],
  hu:['고기와 채소를 파프리카 가루로 붉게 끓인 수프예요.','빨갛고 달콤한 고추예요. 가루로 만들어 요리에 넣어요.','강가에 서 있는 크고 웅장한 건물이에요. 밤에는 불빛이 반짝여요.'],
  ro:['양배추 잎에 고기와 쌀을 돌돌 말아 익힌 음식이에요.','숲에 사는 커다란 갈색 곰이에요. 루마니아 숲에는 곰이 많이 살아요.','언덕 위에 뾰족한 지붕이 솟은 오래된 성이에요. 무서운 옛이야기로 유명해요.'],
  bg:['우유를 발효시켜 만든 새콤한 음식이에요. 불가리아는 요구르트로 유명해요.','장미꽃이 아주 많이 피는 골짜기가 있어요. 장미로 향기로운 기름을 만들어요.','산속 깊은 곳에 있는 줄무늬 아치가 예쁜 수도원이에요.'],
  rs:['다진 고기를 손가락 모양으로 빚어 구운 음식이에요.','줄을 손가락으로 튕겨서 연주하는 작은 기타 같은 악기예요. 신나는 민속 음악을 연주해요.','두 강이 만나는 언덕 위에 있는 오래된 성벽이에요.'],
  hr:['오징어 먹물을 넣어 까맣게 만든 쌀 요리예요.','하얀 털에 까만 점무늬가 있는 개예요. 크로아티아의 달마티아 지방에서 이름을 따왔어요.','에메랄드빛 호수 열여섯 개가 폭포로 이어져 있어요.'],
  ua:['반달 모양 만두예요. 감자나 체리를 넣어요.','하얀 셔츠에 빨간색과 검은색 실로 무늬를 수놓은 전통 옷이에요.','나무가 기찻길 위를 둥글게 덮어서 초록 터널이 된 곳이에요.'],
  is:['아주 진하고 걸쭉한 요구르트예요.','부리가 알록달록한 귀여운 바닷새예요. 바닷가 절벽에 살아요.','땅속 뜨거운 물이 하늘로 솟구쳐 오르는 곳이에요.'],
  cl:['다진 고기 위에 옥수수 반죽을 덮어 오븐에 구운 파이예요.','날개를 펴면 아주 큰 새예요. 높은 산 위를 날아요.','바다 한가운데 이스터섬에 있는 커다란 얼굴 모양 돌 조각이에요.'],
  co:['밥, 콩, 고기, 달걀, 바나나 튀김을 한 접시에 푸짐하게 담은 음식이에요.','초록빛으로 반짝이는 보석이에요. 콜롬비아에서 많이 나요.','강바닥 풀 때문에 강물이 빨강, 노랑, 초록, 파랑으로 보이는 곳이에요.'],
  pe:['날생선을 라임즙에 버무려 새콤하게 먹는 음식이에요.','털이 복슬복슬한 동물이에요. 털로 따뜻한 옷을 만들어요.','높은 산꼭대기에 있는 옛날 잉카 사람들의 도시예요.'],
  ec:['감자를 부드럽게 끓이고 치즈와 아보카도를 올린 수프예요.','아주 크고 오래 사는 거북이에요. 갈라파고스 제도에만 살아요.','지구를 남쪽과 북쪽으로 나누는 적도 선을 기념하는 탑이에요.'],
  bo:['고기와 감자, 국물을 반죽에 싸서 구운 음식이에요. 아침에 많이 먹어요.','털이 길고 목이 긴 동물이에요. 높은 산에서 짐을 날라 줘요.','아주 넓은 소금 땅이에요. 비가 오면 하늘이 거울처럼 비쳐요.'],
  ve:['옥수수 가루로 만든 동그란 빵이에요. 반으로 갈라 치즈나 고기를 넣어 먹어요.','쥐의 친척 가운데 가장 큰 동물이에요. 물을 좋아하고 성격이 순해요.','세상에서 가장 높은 폭포예요. 물이 구름 속에서 떨어지는 것 같아요.'],
  uy:['고기, 햄, 치즈, 달걀을 높이 쌓아 넣은 커다란 샌드위치예요.','속이 빈 작은 열매 껍질에 마테차를 담아 쇠 빨대로 마셔요.','바닷가 모래사장에서 커다란 손가락 다섯 개가 솟아 나온 조각이에요.'],

function restoreCode(code){

let koVoice = null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); koVoice = vs.find(v=>/ko[-_]KR/i.test(v.lang)&&/Google|Yuna|Heami|SunHi/i.test(v.name)) || vs.find(v=>/^ko/i.test(v.lang)) || null; }catch(e){} }

let actx=null;
function tone(notes){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    notes.forEach(([f,d])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.start(t); o.stop(t+d+0.02); t+=d*0.8;
    });
  }catch(e){}
}

function burst(){

function pickRound(){
  const L=LV().list, k=K();
  const score=code=>{ const n=k[code]||0, i=L.indexOf(code);
    if(n===0) return (i+Math.random()*12)/100;   // 아직 못 맞힌 나라
    return 1 + n + Math.random()*1.5; };         // 맞힌 나라: 복습
  return [...L].sort((a,b)=>score(a)-score(b)).slice(0,Math.min(S.roundSize,L.length));
}

// ===== 지도 =====
// 휴대폰 세로 화면에서는 지도를 더 높게 (가로:세로 1.25:1), 그 밖에는 1.8:1
const PORTRAIT_Q='(max-width:560px) and (orientation:portrait)';
function mapAspect(){ try{ return matchMedia(PORTRAIT_Q).matches?1.25:1.8; }catch(e){ return 1.8; } }
function mapSVG(optCodes, plain){
  // 보기 나라들이 다 보이도록 확대
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  optCodes.forEach(code=>{ const b=C[code].box; x0=Math.min(x0,b[0]); y0=Math.min(y0,b[1]); x1=Math.max(x1,b[2]); y1=Math.max(y1,b[3]); });
  let w=x1-x0, h=y1-y0; const pad=Math.max(w,h)*0.18+18; x0-=pad; y0-=pad; w+=pad*2; h+=pad*2;
  const A=mapAspect(), minW=(plain?260:120)*(A<1.5?0.75:1); if(w<minW){x0-=(minW-w)/2; w=minW;}
  if(w/h>A){ const nh=w/A; y0-=(nh-h)/2; h=nh; } else { const nw=h*A; x0-=(nw-w)/2; w=nw; }
  const r = w*0.03;
  let s = `<svg viewBox="${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" role="img" aria-label="세계 지도">`;
  s += `<rect x="-3000" y="-3000" width="7000" height="7000" fill="var(--sea)"/>`;
  s += `<path class="c" d="${GEO.bg}"/>`;
  GEO.countries.forEach(c=>{ if(!optCodes.includes(c.code)) s+=`<path class="c" d="${c.d}"/>`; });
  // 1) 나라 칠하기 (작은 나라는 둘레에 동그라미)
  optCodes.forEach((code,i)=>{
    const c=C[code], col=OPT_COLORS[i];
    s += `<g class="opt" data-i="${i}">`;
    s += `<path d="${c.d}" fill="${col}" stroke="#fff" vector-effect="non-scaling-stroke"/>`;
    const bw=c.box[2]-c.box[0], bh=c.box[3]-c.box[1];
    if(Math.max(bw,bh) < w*0.05) s += `<circle cx="${c.c[0]}" cy="${c.c[1]}" r="${r*1.9}" fill="${col}" fill-opacity=".28" stroke="${col}" stroke-width="${r*0.22}"/>`;
    s += `</g>`;
  });
  if(plain) return s+'</svg>';
  // 2) 번호 동그라미: 붙어 있는 나라(이스라엘·요르단 등)는 서로 밀어내서 겹치지 않게
  const pos=optCodes.map(code=>({x:C[code].c[0], y:C[code].c[1]}));
  for(let it=0; it<60; it++){
    let moved=false;
    for(let a=0;a<pos.length;a++) for(let b=a+1;b<pos.length;b++){
      let dx=pos[b].x-pos[a].x, dy=pos[b].y-pos[a].y, d=Math.hypot(dx,dy), need=r*2.5;
      if(d<need){ if(d<1e-6){ dx=1; dy=0; d=1; } const k=(need-d)/2/d; pos[a].x-=dx*k; pos[a].y-=dy*k; pos[b].x+=dx*k; pos[b].y+=dy*k; moved=true; }
    }
    if(!moved) break;
  }
  optCodes.forEach((code,i)=>{
    const c=C[code], col=OPT_COLORS[i], p=pos[i];
    s += `<g class="opt" data-i="${i}">`;
    if(Math.hypot(p.x-c.c[0],p.y-c.c[1])>r*0.6) s += `<line x1="${c.c[0]}" y1="${c.c[1]}" x2="${p.x}" y2="${p.y}" stroke="${col}" stroke-width="${r*0.22}" stroke-linecap="round"/><circle cx="${c.c[0]}" cy="${c.c[1]}" r="${r*0.28}" fill="${col}" stroke="#fff" stroke-width="${r*0.08}"/>`;
    s += `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${col}" stroke="#fff" stroke-width="${r*0.18}"/>`;
    s += `<text x="${p.x}" y="${p.y}" dy=".36em" text-anchor="middle" font-family="Jua, sans-serif" font-size="${r*1.25}" fill="#fff">${i+1}</text>`;
    s += `</g>`;
  });
  return s+'</svg>';
}

function redrawWardrobe(){ $('#wardrobe').innerHTML=wardrobeHTML(); bindWardrobe(); }
function bindWardrobe(){
  document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{
    const s=STYLES.find(x=>x.id===b.dataset.style);
    if(!AVATAR_IMG[s.id]){ say(`${s.name} 옷은 아직 준비 중이에요.`); return; }
    S.style=s.id; save(); sfx.tap(); say(s.name+' 옷으로 갈아입었어요!'); redrawWardrobe();
  });
  document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.item, k=S.placed.findIndex(p=>p.id===id);
    if(k>=0){ S.placed.splice(k,1); selected=-1; }
    else { const it=ITEM[id]; S.placed.push({id,x:it.x,y:it.y,w:it.w}); selected=S.placed.length-1; say(it.name+'!'); }
    sfx.tap(); save(); redrawWardrobe();
  });
  $('#shopBtn').onclick=()=>{ sfx.tap(); openShop(); };
  const sel=S.placed[selected];
  if(sel){
    $('#szDown').onclick=()=>{ sel.w=Math.max(8,sel.w*0.85); save(); redrawWardrobe(); };
    $('#szUp').onclick=()=>{ sel.w=Math.min(110,sel.w*1.15); save(); redrawWardrobe(); };
    $('#unstick').onclick=()=>{ S.placed.splice(selected,1); selected=-1; save(); sfx.tap(); redrawWardrobe(); };
  }
  // 끌어서 옮기기, 무대 밖으로 끌어내면 떼기
  const stage=$('#stage');
  stage.addEventListener('pointerdown',e=>{ if(!e.target.classList.contains('sticker') && selected>=0){ selected=-1; redrawWardrobe(); } });
  stage.querySelectorAll('.sticker').forEach(el=>{
    el.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      const k=+el.dataset.k, p=S.placed[k], r=stage.getBoundingClientRect();
      const sx=e.clientX, sy=e.clientY, ox=p.x, oy=p.y; let moved=false;
      el.setPointerCapture(e.pointerId); el.classList.add('drag');
      const move=ev=>{
        const dx=ev.clientX-sx, dy=ev.clientY-sy;
        if(Math.abs(dx)+Math.abs(dy)>6) moved=true;
        p.x=ox+dx/r.width*100; p.y=oy+dy/r.height*100;
        el.style.left=p.x+'%'; el.style.top=p.y+'%';
      };
      const up=()=>{
        el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up);
        if(!moved){ selected = selected===k?-1:k; }
        else if(p.x<-5||p.x>105||p.y<-5||p.y>105){ S.placed.splice(k,1); selected=-1; sfx.tap(); }
        else { p.x=Math.max(0,Math.min(100,p.x)); p.y=Math.max(0,Math.min(100,p.y)); selected=k; }
        save(); redrawWardrobe();
      };
      el.addEventListener('pointermove',move); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
    });
  });
}

// ---- 화면 맞추기와 카메라 ----
function vLayout(){
  if(!V) return; const view=$('#vview'); if(!view) return;
  const r=view.getBoundingClientRect(); V.vw=r.width; V.vh=r.height;
  V.s = Math.max(r.width/VW, r.height/VH);
  vCamera(true);
}
function vCamera(){
  const minX=V.vw-VW*V.s, minY=V.vh-VH*V.s;
  V.tx=Math.min(0,Math.max(minX, V.vw/2 - V.px*V.s));
  V.ty=Math.min(0,Math.max(minY, V.vh/2 - (V.py-PLAYER_H/2)*V.s));
  $('#vworld').style.transform=`translate(${V.tx}px,${V.ty}px) scale(${V.s})`;
}
function placePlayer(){
  const el=$('#vplayer'); el.style.left=V.px+'px'; el.style.top=V.py+'px'; el.style.zIndex=Math.round(V.py)+1;
  el.querySelector('.vflip').style.transform=`scaleX(${V.face})`;
}
function toWorld(cx,cy){ const r=$('#vview').getBoundingClientRect(); return { x:(cx-r.left-V.tx)/V.s, y:(cy-r.top-V.ty)/V.s }; }

// ---- 걷기 ----
function walkTo(x,y,arrive){
  V.goal={ x:Math.max(30,Math.min(VW-30,x)), y:Math.max(PLAYER_H*0.6,Math.min(VH-8,y)) }; V.arrive=arrive||null;
  const t=$('#vtarget'); t.hidden=!!arrive; t.style.left=V.goal.x+'px'; t.style.top=V.goal.y+'px';
  t.classList.remove('ping'); void t.offsetWidth; t.classList.add('ping');
  $('#vplayer').classList.add('walk');
}
function vLoop(ts){
  if(!V) return;
  const dt=Math.min(0.05,(ts-(V.last||ts))/1000); V.last=ts;
  if(V.goal){
    const dx=V.goal.x-V.px, dy=V.goal.y-V.py, d=Math.hypot(dx,dy), step=280*dt;
    if(Math.abs(dx)>2) V.face = dx<0 ? -1 : 1;
    if(d<=step){ V.px=V.goal.x; V.py=V.goal.y; V.goal=null; $('#vplayer').classList.remove('walk'); $('#vtarget').hidden=true;
      const a=V.arrive; V.arrive=null; if(a) a(); }
    else { V.px+=dx/d*step; V.py+=dy/d*step; }
    placePlayer(); vCamera();
  }
  // 우체부는 길을 따라 천천히 돌아다님
  const m=V.mail;
  if(m.wait>0){ m.wait-=dt; }
  else{
    const dx=m.gx-m.x, dy=m.gy-m.y, d=Math.hypot(dx,dy), step=55*dt;
    if(d<=step){ m.x=m.gx; m.y=m.gy; m.wait=2+Math.random()*4;
      const pts=[[160,420],[420,520],[640,500],[900,470],[1180,440],[1420,370],[600,820],[950,860],[350,800]];
      const p=pts[Math.floor(Math.random()*pts.length)]; m.gx=p[0]; m.gy=p[1]; }
    else { m.x+=dx/d*step; m.y+=dy/d*step; }
    const el=$('#vmail'); el.style.left=m.x+'px'; el.style.top=m.y+'px'; el.style.zIndex=Math.round(m.y);
    el.classList.toggle('walking', m.wait<=0); el.style.setProperty('--f', dx<0?-1:1);
  }
  vFriendsStep(dt);
  if(!$('#vbubble').hidden && V.bubbleAt) posBubble();
  V.raf=requestAnimationFrame(vLoop);
}

// ---- 말풍선 ----
function vSay(text, at){
  const b=$('#vbubble'); b.textContent=text; b.hidden=false; V.bubbleAt=at||'player';
  posBubble(); say(text);
  clearTimeout(V.bt); V.bt=setTimeout(()=>{ if(V) b.hidden=true; }, Math.max(3500, text.length*170));
}
function posBubble(){
  const b=$('#vbubble'); let x,y;
  if(V.bubbleAt==='player'){ x=V.px; y=V.py-PLAYER_H; }
  else if(V.bubbleAt==='n_mail'){ x=V.mail.x; y=V.mail.y-NPC_H; }
  else if(V.fr && V.fr[V.bubbleAt]){ const f=V.fr[V.bubbleAt]; x=f.x; y=f.y-FRIEND_H; }
  else { const el=document.querySelector(`[data-id="${V.bubbleAt}"]`); if(!el){ x=V.px; y=V.py-PLAYER_H; } else { x=parseFloat(el.style.left); y=parseFloat(el.style.top)-(el.classList.contains('vnpc')?NPC_H:el.offsetHeight); } }
  const sx=x*V.s+V.tx, sy=y*V.s+V.ty;
  const half=Math.min(b.offsetWidth, V.vw-16)/2+8;
  b.style.left=Math.max(half,Math.min(V.vw-half,sx))+'px'; b.style.top=Math.max(b.offsetHeight+8,sy-8)+'px';
}

// ---- 누르기 ----
function onVillageTap(e){
  if(!V || V.decor) { if(V&&V.decor&&!e.target.closest('.vprop')){ V.sel=-1; drawProps(); renderDock(); } return; }
  const hit=e.target.closest('[data-hit]');
  if(!hit){ const w=toWorld(e.clientX,e.clientY); walkTo(w.x,w.y); return; }
  sfx.tap();
  const kind=hit.dataset.hit, id=hit.dataset.id;
  if(kind==='friend'){ const f=V.fr[id]; walkTo(f.x-70, f.y+4, ()=>{ V.face=1; placePlayer(); friendTalk(id); }); return; }
  if(kind==='npc'){
    const info=NPC_INFO[id], line=info.lines[Math.floor(Math.random()*info.lines.length)];
    const nx = id==='n_mail' ? V.mail.x : parseFloat(hit.style.left), ny = id==='n_mail' ? V.mail.y : parseFloat(hit.style.top);
    walkTo(nx-60, ny+6, ()=>{ V.face=1; placePlayer(); vSay(`${info.name}: ${line}`, id); });
    return;
  }
  if(kind==='place'){
    const p=PLACES.find(x=>x.id===id);
    walkTo(p.x, p.y+18, ()=>{
      if(id==='clothes') openClothesShop();
      else if(id==='food') openRestaurant();
      else if(id.startsWith('house')) openHouse(p);
      else if(id==='playground') openPlayground();
      else if(p.npc){ const info=NPC_INFO[p.npc]; vSay(`${info.name}: ${info.lines[0]}`, p.npc); }
      else if(id==='myhouse') vSay('우리 집이에요! 집 안 꾸미기는 곧 할 수 있어요.');
    });
    return;
  }
  if(kind==='lot'){
    const l=LOTS.find(x=>x.id===id);
    walkTo(l.x, l.y+18, ()=>openLotPicker(l));
  }
}

// ---- 랜드마크 짓기 ----
function openLotPicker(l){
  const v=vState(), cur=v.lots[l.id], owned=ownedLandmarks();
  const used=new Set(Object.values(v.lots).filter(Boolean));
  const el=document.createElement('div'); el.className='sheet';
  const list=owned.map(c=>{ const busy=used.has(c)&&c!==cur;
    return `<button class="lm-item ${c===cur?'on':''}" data-c="${c}" ${busy?'disabled':''}>
      <img src="${IMG[`t_${c}_3`]}" alt=""><span>${esc(TREASURE[c][2][1])}</span><small><img src="${C[c].flag}" alt="">${C[c].name}${busy?' · 지었어요':''}</small></button>`; }).join('');
  el.innerHTML=`<div class="panel shop">
    <div class="shop-head sticky"><h3>${cur?esc(TREASURE[cur][2][1]):'빈 땅'}</h3><button class="x-btn" aria-label="닫기">${ICON.x}</button></div>
    ${owned.length?`<p class="note">${cur?'다른 랜드마크로 바꿀 수 있어요.':'어떤 랜드마크를 지을까요?'}</p><div class="lm-grid">${list}</div>`
      :`<p class="lm-empty">아직 지을 수 있는 랜드마크가 없어요.<br>★★★ 단계에서 나라 이름, 위치, 수도를 다 맞히면 랜드마크 카드를 받아요.</p>`}
    ${cur?`<button class="big-btn plain" id="lmClear">빈 땅으로 되돌리기</button>`:''}
    <button class="big-btn plain" id="close">닫기</button></div>`;
  document.body.appendChild(el); addX(el);
  say(cur ? treasureLine(cur,3) : (owned.length?'어떤 랜드마크를 지을까요?':'아직 지을 수 있는 랜드마크가 없어요.'));
  const close=()=>el.remove();
  el.querySelector('#close').onclick=close;
  el.addEventListener('click',e=>{ if(e.target===el) close(); });
  el.querySelectorAll('.lm-item').forEach(b=>b.onclick=()=>{
    const c=b.dataset.c; v.lots[l.id]=c; save(); close(); drawLots(); sfx.win(); burst();
    const nm=TREASURE[c][2][1]; vSay(`${C[c].name}의 ${nm}${hasBatchim(nm)?'을':'를'} 지었어요!`, l.id);
  });
  const clr=el.querySelector('#lmClear'); if(clr) clr.onclick=()=>{ v.lots[l.id]=null; save(); close(); drawLots(); sfx.tap(); };
}

// ---- 꾸미기 ----
function toggleDecor(){
  V.decor=!V.decor; V.sel=-1; V.goal=null; $('#vplayer').classList.remove('walk');
  $('#vDecor').classList.toggle('on',V.decor); $('#vDecor').textContent=V.decor?'다 했어요':'꾸미기';
  $('#vdock').hidden=!V.decor; $('#vview').classList.toggle('decor',V.decor);
  drawProps(); renderDock();
  if(V.decor) vSay('꾸미기를 시작해요! 아래에서 고르면 마을에 놓여요. 끌어서 옮겨 보세요.');
}
function renderDock(){
  const v=vState(), sel=v.props[V.sel];
  const owned=PROPS.filter(p=>(v.inv[p.id]||0)>0);
  $('#vdock').innerHTML = `
    ${sel?`<div class="vsel-bar"><span>${PROP[sel.id].name}</span><button id="vPut">넣어 두기</button></div>`:''}
    <div class="vtray">
      <button class="vshop" id="vShop">${ICON.star}<span>소품 가게</span></button>
      ${owned.length?owned.map(p=>`<button class="vinv" data-p="${p.id}"><img src="${IMG[p.id]}" alt="${p.name}"><i>${v.inv[p.id]}</i></button>`).join('')
        :`<p class="note">가게에서 소품을 사면 여기에 생겨요.</p>`}
    </div>`;
  $('#vShop').onclick=()=>{ sfx.tap(); openPropShop(); };
  document.querySelectorAll('.vinv').forEach(b=>b.onclick=()=>{
    const id=b.dataset.p; v.inv[id]--;
    const c=toWorld(V.vw/2+$('#vview').getBoundingClientRect().left, V.vh*0.6+$('#vview').getBoundingClientRect().top);
    // 화면 가운데 둘레에 빙 돌아가며 놓아서 겹치지 않게
    const n=v.props.length, ang=n*2.4, rad=40+((n*37)%90);
    v.props.push({id, x:Math.round(Math.max(40,Math.min(VW-40,c.x+Math.cos(ang)*rad*1.4))), y:Math.round(Math.max(80,Math.min(VH-10,c.y+Math.sin(ang)*rad)))}); V.sel=v.props.length-1;
    save(); sfx.tap(); drawProps(); renderDock();
  });
  const put=$('#vPut'); if(put) put.onclick=()=>{ const p=v.props.splice(V.sel,1)[0]; v.inv[p.id]=(v.inv[p.id]||0)+1; V.sel=-1; save(); drawProps(); renderDock(); };
}
function bindPropDrag(){
  document.querySelectorAll('.vprop.edit').forEach(el=>{
    el.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      const k=+el.dataset.prop, p=vState().props[k], sx=e.clientX, sy=e.clientY, ox=p.x, oy=p.y; let moved=false;
      el.setPointerCapture(e.pointerId); el.classList.add('drag');
      const move=ev=>{ const dx=(ev.clientX-sx)/V.s, dy=(ev.clientY-sy)/V.s; if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
        p.x=Math.max(20,Math.min(VW-20,ox+dx)); p.y=Math.max(40,Math.min(VH-4,oy+dy)); el.style.left=p.x+'px'; el.style.top=p.y+'px'; el.style.zIndex=Math.round(p.y); };
      const up=()=>{ el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up);
        p.x=Math.round(p.x); p.y=Math.round(p.y); V.sel = moved ? k : (V.sel===k?-1:k); save(); drawProps(); renderDock(); };
      el.addEventListener('pointermove',move); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
    });
    el.addEventListener('click',e=>e.stopPropagation());
  });
}
function openPropShop(){
  const v=vState(), el=document.createElement('div'); el.className='sheet';
  const draw=()=>{ el.innerHTML=`<div class="panel shop">
    <div class="shop-head sticky"><h3>소품 가게</h3><div class="stars">${ICON.star}<span>${S.stars}</span></div><button class="x-btn" aria-label="닫기">${ICON.x}</button></div>
    <p class="note">같은 소품을 여러 개 살 수 있어요.</p>
    <div class="shop-grid">${PROPS.map(p=>`<button class="shop-item" data-buy="${p.id}">
      <img src="${IMG[p.id]}" alt=""><span>${p.name}</span>
      <small class="${S.stars<p.price?'short':''}">${ICON.star} ${p.price}</small>${v.inv[p.id]?`<em class="own">${v.inv[p.id]}개 있어요</em>`:''}</button>`).join('')}</div>
    <button class="big-btn plain" id="close">닫기</button></div>`;
    el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
      const p=PROP[b.dataset.buy];
      if(S.stars<p.price){ sfx.soft(); say(`${p.name}${hasBatchim(p.name)?'은':'는'} 별 ${p.price}개가 필요해요. 별 ${p.price-S.stars}개만 더 모아요!`); return; }
      S.stars-=p.price; v.inv[p.id]=(v.inv[p.id]||0)+1; save(); sfx.win(); say(`${p.name}${hasBatchim(p.name)?'을':'를'} 샀어요!`);
      const st=$('#vStars'); if(st) st.textContent=S.stars; draw();
    });
    el.querySelector('#close').onclick=()=>{ el.remove(); renderDock(); };
  };
  draw(); document.body.appendChild(el); addX(el);
  el.addEventListener('click',e=>{ if(e.target===el){ el.remove(); renderDock(); } });
}


// ===================== 마을 2차: 친구 =====================
const FRIEND_H = 100;
// 물건 그림이라 친구로는 어색한 ★★ 카드
const NOT_FRIEND = ['tr','nl','it','mx','no','de','se','sg','uz','pk','cu','ir'];
const HOUSES = ['house1','house2','house3'];
function friendOK(c){ return (K(2)[c]||0)>=1 && IMG[`t_${c}_2`] && TREASURE[c] && !NOT_FRIEND.includes(c); }
function friendName(c){ const [kind,nm]=TREASURE[c][1]; return kind==='동물' ? nm : `${C[c].name} 친구`; }
function fState(){ const v=vState(); v.res=v.res||{}; v.hearts=v.hearts||{}; v.talked=v.talked||{}; return v; }
function residents(){ const v=fState(); return HOUSES.map(h=>v.res[h]).filter(c=>c&&friendOK(c)); }

function vFriendsInit(){
  const v=fState(); V.fr={};
  HOUSES.forEach(h=>{ const c=v.res[h]; if(!c||!friendOK(c)) return; const p=PLACES.find(x=>x.id===h);
    V.fr[c]={ c, hx:p.x, hy:p.y+40, x:p.x+50, y:p.y+40, gx:p.x+50, gy:p.y+40, wait:Math.random()*3 }; });
  // 배고픈 친구 한 명 (그 나라 ★ 음식 카드가 있을 때만)
  if(!v.req){ const hungry=Object.keys(V.fr).filter(c=>(K(1)[c]||0)>=1 && IMG[`t_${c}_1`]);
    if(hungry.length && Math.random()<0.6) v.req=hungry[Math.floor(Math.random()*hungry.length)]; save(); }
  drawFriends();
}
function drawFriends(){
  const v=fState();
  $('#vfriends').innerHTML=Object.values(V.fr).map(f=>`<div class="vent vfriend" data-hit="friend" data-id="${f.c}" style="left:${f.x}px;top:${f.y}px;z-index:${Math.round(f.y)}">
    ${v.req===f.c?'<span class="vneed">!</span>':''}<img src="${IMG[`t_${f.c}_2`]}" alt="${friendName(f.c)}" draggable="false" style="height:${FRIEND_H}px"></div>`).join('');
}
function vFriendsStep(dt){
  if(!V.fr) return;
  for(const f of Object.values(V.fr)){
    if(f.wait>0){ f.wait-=dt; continue; }
    const dx=f.gx-f.x, dy=f.gy-f.y, d=Math.hypot(dx,dy), step=45*dt;
    const el=document.querySelector(`.vfriend[data-id="${f.c}"]`); if(!el) continue;
    if(d<=step){ f.x=f.gx; f.y=f.gy; f.wait=2+Math.random()*5; const a=Math.random()*6.28, r=60+Math.random()*120;
      f.gx=Math.max(60,Math.min(VW-60,f.hx+Math.cos(a)*r)); f.gy=Math.max(140,Math.min(VH-10,f.hy+Math.abs(Math.sin(a))*r*0.5)); el.classList.remove('walking'); }
    else { f.x+=dx/d*step; f.y+=dy/d*step; el.classList.add('walking'); el.style.setProperty('--f', dx<0?-1:1); }
    el.style.left=f.x+'px'; el.style.top=f.y+'px'; el.style.zIndex=Math.round(f.y);
  }
}
function heartsOf(c){ return Math.min(10, fState().hearts[c]||0); }
function addHearts(c,n){
  const v=fState(), before=heartsOf(c); v.hearts[c]=Math.min(10,(v.hearts[c]||0)+n); const now=heartsOf(c); save();
  heartPop(c,n);
  if(before<5 && now>=5){ S.stars+=5; save(); setTimeout(()=>vSay(`${friendName(c)}: 우리 친해졌다! 선물로 별 다섯 개 줄게!`, c),2600); }
  if(before<10 && now>=10){ setTimeout(()=>vSay(`${friendName(c)}: 우리는 이제 단짝 친구야!`, c),2600); }
  const st=$('#vStars'); if(st) st.textContent=S.stars;
}
function heartPop(c,n){
  const f=V&&V.fr[c]; if(!f) return; const el=document.createElement('div'); el.className='vent vheart';
  el.textContent='♥'.repeat(Math.min(3,n)); el.style.left=f.x+'px'; el.style.top=(f.y-FRIEND_H)+'px'; el.style.zIndex=2000;
  $('#vworld').appendChild(el); setTimeout(()=>el.remove(),1400);
}
function friendLines(c){
  const t=TREASURE[c], cc=C[c], me=friendName(c), animal=t[1][0]==='동물';
  const L=[ animal ? `안녕! 나는 ${cc.name}에 사는 ${me}야.` : `안녕! 나는 ${cc.name}에서 왔어.`,
    `우리 나라 수도는 ${cc.capital}${hasBatchim(cc.capital)?'이야':'야'}.`,
    `우리 나라는 ${cc.continent}에 있어.` ];
  if((K(1)[c]||0)>=1) L.push(`우리 나라 음식 ${t[0][1]}, 먹어 봤어? 정말 맛있어!`);
  if((K(3)[c]||0)>=1) L.push(`우리 나라에는 ${t[2][1]}${hasBatchim(t[2][1])?'이':'가'} 있어. 언젠가 같이 가 보자!`);
  return L;
}
function friendTalk(c){
  const v=fState(), me=friendName(c);
  if(v.req===c){ const food=TREASURE[c][0][1]; vSay(`${me}: 배고파! ${food} 먹고 싶어. 식당에서 가져다줄래?`, c); return; }
  const lines=friendLines(c), line=lines[Math.floor(Math.random()*lines.length)];
  vSay(`${me}: ${line}`, c);
  if(v.talked[c]!==today()){ v.talked[c]=today(); addHearts(c,1); }
}

// 친구 집: 비었으면 초대, 살고 있으면 친구 카드
function openHouse(p){
  const v=fState(), c=v.res[p.id];
  if(c && friendOK(c)) return openFriendCard(p, c);
  const living=new Set(Object.values(v.res).filter(Boolean));
  const cand=Object.keys(K(2)||{}).filter(x=>friendOK(x)&&!living.has(x));
  const el=document.createElement('div'); el.className='sheet';
  el.innerHTML=`<div class="panel shop">
    <div class="shop-head sticky"><h3>빈집</h3><button class="x-btn" aria-label="닫기">${ICON.x}</button></div>
    ${cand.length?`<p class="note">누구를 이 집에 초대할까요?</p><div class="lm-grid">${cand.map(x=>`<button class="lm-item" data-c="${x}">
      <img src="${IMG[`t_${x}_2`]}" alt=""><span>${esc(friendName(x))}</span><small><img src="${C[x].flag}" alt="">${C[x].name}</small></button>`).join('')}</div>`
    :`<p class="lm-empty">아직 초대할 친구가 없어요.<br>★★ 단계에서 나라 이름, 위치, 수도를 다 맞히면 친구 카드를 받아요.</p>`}
    <button class="big-btn plain" id="close">닫기</button></div>`;
  document.body.appendChild(el); addX(el);
  say(cand.length?'누구를 초대할까요?':'아직 초대할 친구가 없어요.');
  const close=()=>el.remove(); el.querySelector('#close').onclick=close; el.addEventListener('click',e=>{ if(e.target===el) close(); });
  el.querySelectorAll('.lm-item').forEach(b=>b.onclick=()=>{
    const x=b.dataset.c; v.res[p.id]=x; save(); close(); sfx.win(); burst(); vFriendsInit();
    setTimeout(()=>vSay(`${friendName(x)}: 안녕! 오늘부터 우리 이웃이야. 반가워!`, x),300);
  });
}
function openFriendCard(p, c){
  const v=fState(), h=heartsOf(c);
  const el=document.createElement('div'); el.className='sheet';
  el.innerHTML=`<div class="panel country">
    <div class="shop-head sticky"><h3>${esc(friendName(c))}</h3><button class="x-btn" aria-label="닫기">${ICON.x}</button></div>
    <div class="fcard"><img class="fpic" src="${IMG[`t_${c}_2`]}" alt=""><div>
      <div class="fflag"><img src="${C[c].flag}" alt="">${C[c].name}에서 왔어요</div>
      <div class="fhearts" aria-label="하트 ${h}개">${'<i class="on">♥</i>'.repeat(h)}${'<i>♥</i>'.repeat(10-h)}</div>
      <p class="note">${h>=10?'단짝 친구예요!':h>=5?'친한 친구예요. 하트 10개면 단짝!':'하루에 한 번 말을 걸면 하트가 생겨요. 5개면 선물을 줘요.'}</p></div></div>
    <button class="big-btn plain" id="move">다른 친구로 바꾸기</button>
    <button class="big-btn plain" id="close">닫기</button></div>`;
  document.body.appendChild(el); addX(el);
  say(`${friendName(c)}. 하트 ${h}개예요.`);
  const close=()=>el.remove(); el.querySelector('#close').onclick=close; el.addEventListener('click',e=>{ if(e.target===el) close(); });
  el.querySelector('#move').onclick=e=>{ const b=e.currentTarget; if(!b.dataset.sure){ b.dataset.sure=1; b.textContent='정말 바꿀까요? 한 번 더 누르세요'; return; }
    v.res[p.id]=null; if(v.req===c) v.req=null; save(); close(); vFriendsInit(); openHouse(p); };
}

      <div class="vroom-main" id="rMain"></div>
    </div>`;

  el.querySelector('#rBack').onclick=()=>{ sfx.tap(); r.close(); };
  return r;
}

// ---- 식당 ----
function openRestaurant(){
  const v=fState();
  const foods=Object.keys(K(1)||{}).filter(c=>(K(1)[c]||0)>=1 && IMG[`t_${c}_1`] && TREASURE[c]);
  const r=openInterior({ title:'식당', bg:'in_food', npc:'n_chef', cls:'room-food', onClose:()=>{ if(V) drawFriends(); } });
  const draw=()=>{
    const req=v.req && V.fr[v.req] ? v.req : null;

function startMemory(r, back){
  const PAIRS=10, RECALL=0.35;               // 할아버지 기억력 (낮을수록 쉬움)
  const lit=new Set([...Object.keys(K(1)||{}),...Object.keys(K(2)||{}),...Object.keys(K(3)||{})]);
  let pool=shuffle(LV().list.filter(c=>lit.has(c)));
  pool=pool.concat(shuffle(LV().list.filter(c=>!lit.has(c)))).slice(0,PAIRS);
  const cards=shuffle(pool.flatMap(c=>[c,c])).map((c,i)=>({ c, i, up:false, owner:null }));
  const g={ turn:'me', open:[], score:{me:0,ai:0}, mem:{}, busy:false, done:false };
  const main=r.el.querySelector('#rMain');
  main.innerHTML=`<div class="mboard">
      <div class="mscore"><div class="mp me" id="mpMe"><img src="${playerImg()}" alt=""><span>나</span><b id="scMe">0</b></div>
        <div class="mturn" id="mTurn">내 차례</div>
        <div class="mp ai" id="mpAi"><img src="${IMG.n_grandpa}" alt=""><span>할아버지</span><b id="scAi">0</b></div></div>
      <div class="mgrid">${cards.map(k=>`<button class="mcard" data-i="${k.i}" aria-label="카드"><span class="mback"></span><span class="mface"><img src="${C[k.c].flag}" alt=""></span></button>`).join('')}</div>
      <button class="big-btn plain sm" id="mQuit">그만하기</button></div>`;
  const el=i=>main.querySelector(`.mcard[data-i="${i}"]`);
  const setTurn=t=>{ g.turn=t; main.querySelector('#mTurn').textContent = t==='me'?'내 차례':'할아버지 차례';
    main.querySelector('#mpMe').classList.toggle('on',t==='me'); main.querySelector('#mpAi').classList.toggle('on',t==='ai'); };
  const flip=(i,up)=>{ cards[i].up=up; el(i).classList.toggle('up',up); if(up){ g.mem[i]=cards[i].c; } };
  const remain=()=>cards.filter(k=>!k.owner);
  const finish=()=>{
    g.done=true; const {me,ai}=g.score, prize = me>ai?3: me===ai?2:1;
    S.stars+=prize; save(); r.stars();
    const msg = me>ai ? `와! ${me}대 ${ai}로 이겼어요! 별 ${prize}개를 받았어요.` : me===ai ? `${me}대 ${ai} 비겼어요! 별 ${prize}개를 받았어요.` : `${me}대 ${ai}, 할아버지가 이겼어요. 그래도 잘했어요! 별 ${prize}개를 받았어요.`;
    if(me>ai){ sfx.win(); burst(); setTimeout(burst,400); } else sfx.good();
    main.querySelector('#mTurn').textContent = me>ai?'내가 이겼어요!':me===ai?'비겼어요!':'할아버지가 이겼어요';
    r.say(msg);
    const q=main.querySelector('#mQuit'); q.textContent='한 판 더'; q.onclick=()=>{ sfx.tap(); startMemory(r, back); };
    const bk=document.createElement('button'); bk.className='big-btn plain sm'; bk.textContent='놀이 고르기'; bk.onclick=()=>{ sfx.tap(); back(); }; q.after(bk);
  };
  const check=(who)=>{
    const [a,b]=g.open; g.open=[];
    if(cards[a].c===cards[b].c){
      cards[a].owner=cards[b].owner=who; g.score[who]++; el(a).classList.add('got',who); el(b).classList.add('got',who);
      delete g.mem[a]; delete g.mem[b];
      main.querySelector(who==='me'?'#scMe':'#scAi').textContent=g.score[who];
      const nm=C[cards[a].c].name;
      if(who==='me'){ sfx.good(); r.say(`${nm} 국기! 짝을 찾았어요. 한 번 더 해요!`); } else { sfx.soft(); r.say(`할아버지가 ${nm} 국기를 찾았어요.`); }
      if(!remain().length){ setTimeout(finish,900); return; }
      if(who==='ai') setTimeout(aiTurn,1600); else g.busy=false;
    } else {
      setTimeout(()=>{ flip(a,false); flip(b,false); g.busy=false;
        if(who==='me'){ setTurn('ai'); g.busy=true; setTimeout(aiTurn,800); } else setTurn('me'); }, 1300);
    }
  };
  const aiPick=()=>{
    const left=remain().filter(k=>!k.up).map(k=>k.i);
    // 1) 기억하고 있는 짝이 있으면 (기억력만큼)
    const seen={}; for(const i of left){ const c=g.mem[i]; if(c){ (seen[c]=seen[c]||[]).push(i); } }
    const known=Object.values(seen).find(x=>x.length>=2);
    if(known && Math.random()<RECALL) return known.slice(0,2);
    const unknown=left.filter(i=>!g.mem[i]), from=unknown.length?unknown:left;
    const a=from[Math.floor(Math.random()*from.length)];
    const others=left.filter(i=>i!==a);
    const match=others.find(i=>g.mem[i]===cards[a].c);
    const b = (match!==undefined && Math.random()<RECALL) ? match : others[Math.floor(Math.random()*others.length)];
    return [a,b];
  };
  const aiTurn=()=>{
    if(g.done||!r.el.isConnected) return; g.busy=true;
    const [a,b]=aiPick();
    flip(a,true); sfx.tap();
    setTimeout(()=>{ flip(b,true); sfx.tap(); g.open=[a,b]; setTimeout(()=>check('ai'),700); },800);
  };
  main.querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; if(g.turn!=='me'||g.busy||cards[i].up||cards[i].owner) return;
    flip(i,true); sfx.tap(); g.open.push(i);
    if(g.open.length===2){ g.busy=true; setTimeout(()=>check('me'),500); }
  });
  main.querySelector('#mQuit').onclick=()=>{ sfx.tap(); g.done=true; back(); };
  setTurn('me');
  r.say('같은 국기 두 장을 찾아요. 먼저 뒤집어 봐요!');
}


// ===================== 놀이터: 국기 색칠하기 =====================
const CRAYONS = [['빨강','#E53935'],['주황','#FB8C00'],['노랑','#FDD835'],['초록','#43A047'],['하늘색','#4FC3F7'],['파랑','#1E5BC6'],['보라','#8E24AA'],['분홍','#F48FB1'],['갈색','#8D6E63'],['검정','#212121'],['하양','#FFFFFF']];
const COLOR_NAMES = [['빨강','#E0202A'],['진한 빨강','#A8162C'],['주황','#FF8C1A'],['노랑','#FFD21F'],['금색','#D4A017'],['초록','#1E9E4A'],['진한 초록','#006233'],['하늘색','#5BB8F0'],['파랑','#1E5BC6'],['남색','#14285F'],['보라','#7B3FA0'],['분홍','#F48FB1'],['갈색','#7A4A2A'],['검정','#111111'],['하양','#FFFFFF'],['회색','#9AA0A6']];
function hexRGB(h){ return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); }
function cdist(a,b){ const x=hexRGB(a), y=hexRGB(b); return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2]); }
function colorName(h){ let best=COLOR_NAMES[0], d=1e9; for(const n of COLOR_NAMES){ const k=cdist(h,n[1]); if(k<d){ d=k; best=n; } } return best[0]; }
function colorable(){ const F=window.COLORFLAGS||{}; return LV().list.filter(c=>F[c]); }

function pickColorFlag(r, back){
  const F=window.COLORFLAGS||{}, done=S.colored||{};
  const lit=c=>[1,2,3].some(t=>(K(t)[c]||0)>=1);
  const list=colorable().sort((a,b)=>(lit(b)-lit(a)));
  r.el.querySelector('#rMain').innerHTML=`<div class="cpick">
    <div class="cpick-head"><b>어떤 국기를 칠할까요?</b><button class="big-btn plain sm" id="cBack">놀이 고르기</button></div>
    <div class="cpick-grid">${list.map(c=>`<button class="cpick-item ${done[c]?'done':''}" data-c="${c}"><img src="${C[c].flag}" alt=""><span>${C[c].name}</span>${done[c]?'<i>완성</i>':''}</button>`).join('')}</div></div>`;
  r.el.querySelectorAll('.cpick-item').forEach(b=>b.onclick=()=>{ sfx.tap(); colorFlag(r, b.dataset.c, ()=>pickColorFlag(r, back)); });
  r.el.querySelector('#cBack').onclick=()=>{ sfx.tap(); back(); };
  r.say('어떤 국기를 칠해 볼까? 마음에 드는 걸 골라 보렴.');
}

function colorFlag(r, c, back){
  const F=window.COLORFLAGS[c], truth=F.colors, n=truth.length, fill=new Array(n).fill(null);
  // 진짜 색 + 헷갈리는 크레파스 2개
  const extra=shuffle(CRAYONS.map(x=>x[1]).filter(h=>truth.every(t=>cdist(h,t)>90))).slice(0,2);
  const pal=shuffle([...truth, ...extra]);
  let cur=null;
  const main=r.el.querySelector('#rMain');
  main.innerHTML=`<div class="cwork">
    <div class="cmodel"><span>보기</span><img src="${C[c].flag}" alt="${C[c].name} 국기"><b>${C[c].name}</b><button class="speak sm" id="cSp" aria-label="듣기">${ICON.speak}</button></div>
    <div class="cbig" id="cBig">${F.svg}</div>
    <div class="cpal">${pal.map(h=>`<button class="crayon" data-h="${h}" style="--c:${h}" aria-label="${colorName(h)}"><i></i></button>`).join('')}
      <button class="crayon eraser" data-h="" aria-label="지우개"><i></i></button></div>
    <div class="crow"><button class="big-btn plain sm" id="cReset">처음부터</button><button class="big-btn plain sm" id="cOther">다른 국기</button></div></div>`;
  const svg=main.querySelector('#cBig svg');
  const paint=(g,h)=>{ fill[g]=h; svg.querySelectorAll(`[data-g="${g}"]`).forEach(e=>{ e.style.fill = h || '#EEF1F5'; }); };
  for(let g=0; g<n; g++) paint(g,null);
  const pick=(h,btn)=>{ cur=h; main.querySelectorAll('.crayon').forEach(b=>b.classList.toggle('on',b===btn)); sfx.tap(); say(h?colorName(h):'지우개'); };
  main.querySelectorAll('.crayon').forEach(b=>b.onclick=()=>pick(b.dataset.h, b));
  svg.addEventListener('click',e=>{
    const t=e.target.closest('[data-g]'); if(!t) return;
    if(cur===null){ sfx.soft(); r.say('먼저 아래에서 크레파스를 골라요!'); return; }
    const g=+t.dataset.g; paint(g, cur||null); sfx.tap();
    svg.querySelectorAll('.wrong').forEach(x=>x.classList.remove('wrong'));
    if(fill.every(Boolean)) check();
  });
  const check=()=>{
    const wrong=fill.map((h,g)=>h!==truth[g]?g:-1).filter(g=>g>=0);
    if(!wrong.length){
      const first=!(S.colored||{})[c]; S.colored=S.colored||{}; S.colored[c]=true; S.stars+= first?3:1; save(); r.stars();
      sfx.win(); burst(); setTimeout(burst,400); svg.classList.add('finished');
      r.say(`${C[c].name} 국기 완성! 정말 똑같아요. 별 ${first?3:1}개를 받았어요.`);
    } else {
      sfx.soft(); wrong.forEach(g=>svg.querySelectorAll(`[data-g="${g}"]`).forEach(e=>e.classList.add('wrong')));
      r.say('거의 다 됐어요! 반짝이는 곳의 색을 보기와 비교해 봐요.');
    }
  };
  main.querySelector('#cReset').onclick=()=>{ for(let g=0; g<n; g++) paint(g,null); svg.classList.remove('finished'); sfx.tap(); };
  main.querySelector('#cOther').onclick=()=>{ sfx.tap(); back(); };
  main.querySelector('#cSp').onclick=()=>say(`${C[c].name} 국기`);
  r.say(`${C[c].name} 국기를 칠해 봐요. 크레파스를 고르고 칸을 눌러요.`);
}

// ===== 보호자 메뉴 (톱니바퀴 길게 누르기) =====
function bindGear(){
  // 길게 누르기(1초) 또는 빠르게 5번 누르기. 아이폰 사파리는 오래 누르면 pointercancel을 보내므로
  // 손가락이 버튼 밖으로 크게 벗어날 때만 취소합니다.
  const g=$('#gear'); let t=null, sx=0, sy=0, opened=false, taps=[];
  const open=()=>{ opened=true; g.classList.remove('holding'); openParent(); };
  const start=(x,y)=>{ opened=false; sx=x; sy=y; clearTimeout(t); g.classList.add('holding'); t=setTimeout(open,1000); };
  const stop=()=>{ clearTimeout(t); g.classList.remove('holding'); };
  const move=(x,y)=>{ if(Math.hypot(x-sx,y-sy)>40) stop(); };
  if(window.PointerEvent){
    g.addEventListener('pointerdown',e=>{ e.preventDefault(); start(e.clientX,e.clientY); });
    g.addEventListener('pointermove',e=>move(e.clientX,e.clientY));
    g.addEventListener('pointerup',stop);
  } else {
    g.addEventListener('touchstart',e=>{ const p=e.touches[0]; start(p.clientX,p.clientY); },{passive:true});
    g.addEventListener('touchmove',e=>{ const p=e.touches[0]; move(p.clientX,p.clientY); },{passive:true});
    g.addEventListener('touchend',stop);
  }
  g.addEventListener('contextmenu',e=>e.preventDefault());
  g.onclick=()=>{
    if(opened){ opened=false; return; }
    const now=Date.now(); taps=taps.filter(x=>now-x<2500); taps.push(now);
    if(taps.length>=5){ taps=[]; open(); opened=false; return; }
    toast(`보호자 메뉴: 길게 누르거나 ${5-taps.length}번 더 누르세요`);
  };
}
function openParent(){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el=document.createElement('div'); el.className='sheet';
  const draw=()=>{ el.innerHTML=`<div class="panel">
    <div class="shop-head sticky"><h3>보호자 메뉴</h3><button class="x-btn" aria-label="닫기">${ICON.x}</button></div>
    <div class="set-row"><span>통과 기준 (15문제 중)</span><span class="stepper"><button id="pmDown">−</button><span>${S.passMark}</span><button id="pmUp">+</button></span></div>
    <div class="set-row"><span>오늘 테스트 다시 열기</span><button id="unlockTest" ${testLocked()?'':'disabled'}>${testLocked()?'열기':'열려 있음'}</button></div>
    <div class="set-row"><span>한 번에 공부할 나라 수</span><span class="stepper"><button id="rsDown">−</button><span>${S.roundSize}</span><button id="rsUp">+</button></span></div>

    <div class="set-row"><span>기록 백업${S.lastBackup?`<br><small class="note">마지막 백업 ${S.lastBackup}</small>`:''}</span><button id="bk">백업 코드 복사</button></div>
    <textarea id="bkText" class="bk-text" rows="3" placeholder="여기에 백업 코드를 붙여 넣고 '되살리기'를 누르세요" aria-label="백업 코드"></textarea>
    <div class="set-row" style="border:0;padding:0"><span>백업 코드로 되살리기</span><button id="rsBk">되살리기</button></div>
    <div class="set-row"><span>기록 모두 지우기</span><button class="danger" id="reset">지우기</button></div>
    <p class="note">앱 버전 ${APP_VERSION}</p>
    <p class="note">기록은 이 기기에만 저장됩니다. 브라우저 데이터를 지우거나 앱을 지우면 함께 사라지니, 가끔 백업 코드를 복사해서 카톡 '나와의 채팅'에 보내 두세요.</p>
    <button class="big-btn plain" id="close">닫기</button></div>`;
    el.querySelector('#pmDown').onclick=()=>{ S.passMark=Math.max(8,S.passMark-1); save(); draw(); };
    el.querySelector('#pmUp').onclick=()=>{ S.passMark=Math.min(15,S.passMark+1); save(); draw(); };
    el.querySelector('#unlockTest').onclick=()=>{ S.testLock[S.level]=null; save(); draw(); toast('오늘 다시 도전할 수 있어요'); };
    el.querySelector('#bk').onclick=()=>{
      S.lastBackup=today(); save();
      const code=backupCode(), ta=el.querySelector('#bkText'); ta.value=code;
      const fallback=()=>{ ta.focus(); ta.select(); toast('코드를 길게 눌러 복사하세요'); };
      try{ navigator.clipboard.writeText(code).then(()=>toast('백업 코드를 복사했어요'),fallback); }catch(e){ fallback(); }
    };
    el.querySelector('#rsBk').onclick=e=>{
      const b=e.currentTarget, code=el.querySelector('#bkText').value;
      if(!code.trim()){ toast('백업 코드를 먼저 붙여 넣으세요'); return; }
      if(!b.dataset.sure){ b.dataset.sure=1; b.textContent='지금 기록이 바뀌어요. 한 번 더'; return; }
      try{ restoreCode(code); toast('기록을 되살렸어요'); draw(); }
      catch(err){ b.dataset.sure=''; b.textContent='되살리기'; toast('코드가 올바르지 않아요. 전체를 다시 복사해 주세요'); }
    };
    el.querySelector('#rsDown').onclick=()=>{ S.roundSize=Math.max(5,S.roundSize-5); save(); draw(); };
    el.querySelector('#rsUp').onclick=()=>{ S.roundSize=Math.min(15,S.roundSize+5); save(); draw(); };
    el.querySelector('#allOpen').onclick=()=>{ S.allOpen=!S.allOpen; save(); draw(); };
    el.querySelector('#rate').onclick=()=>{ S.rate=S.rate<0.85?0.95:0.75; save(); draw(); say('이 속도로 말할게요'); };
    el.querySelector('#reset').onclick=e=>{ const b=e.currentTarget; if(b.dataset.sure){ S=fresh(); save(); el.remove(); renderHome(); toast('기록을 지웠어요'); } else { b.dataset.sure=1; b.textContent='한 번 더 누르면 지워져요'; } };
    el.querySelector('#close').onclick=()=>{ el.remove(); renderHome(); };
  };
  draw(); document.body.appendChild(el); addX(el);
}

// ===== 학습 단계 =====
let P=null; // 진행 중인 판
function startRound(){
  if(!tierOpen(S.tier)) S.tier=1;
  P={ mode:'stage', tier:S.tier, list:shuffle(pickRound()), idx:0, n:optCount(), earned:0, results:[], before:learnedCount() };
  showName();
}
function pool(){ return LV().list; }
function playBar(){
  const total = P.mode==='stage' ? P.list.length : P.qs.length;
  const dots = Array.from({length:total},(_,k)=>{
    if(k<P.idx) return P.mode==='stage' ? `<i class="${P.results[k]?'ok':'done'}"></i>` : '<i class="done"></i>';
    return k===P.idx?'<i class="now"></i>':'<i></i>';
  }).join('');
  return `<div class="bar"><button class="icon-btn" id="homeBtn" aria-label="처음으로">${ICON.home}</button><div class="grow progress">${dots}</div><div class="stars">${ICON.star}<span>${S.stars}</span></div></div>`;
}
function bindBar(){ $('#homeBtn').onclick=()=>{ P=null; renderHome(); }; }

function showName(){
  const c=C[P.list[P.idx]];
  P.f={name:true,map:true,cap:true};   // 세 문제 모두 첫 시도에 맞혀야 불이 켜짐
  if(!S.seen[c.code]){ S.seen[c.code]=true; save(); }
  const opts=shuffle([c.code,...sample(pool().filter(x=>x!==c.code),P.n-1)]);
  const labels=opts.map(x=>C[x].name);
  const q='이 국기는 어느 나라일까요?';
  $('#app').innerHTML = playBar()+`
    <div class="flag-q"><img src="${c.flag}" alt="국기"><button class="speak" id="sp" aria-label="다시 듣기">${ICON.speak}</button></div>
    <h2 class="q-line">${q}</h2>
    ${choicesHTML(labels)}`;
  bindBar();
  readOptions(q,labels); $('#sp').onclick=()=>readOptions(q,labels);
  let locked=false;
  bindChoices(labels,(i,b)=>{
    if(locked) return;
    if(opts[i]===c.code){
      locked=true; sfx.good(); burst(); b.classList.add('right');
      if(P.f.name){ S.stars++; P.earned++; save(); }
      say(`맞아요! ${c.name} 국기예요.`);
      setTimeout(showMap,2300);
    } else {
      locked=true; P.f.name=false; sfx.soft(); b.classList.add('wrong');
      document.querySelector(`.choice[data-i="${opts.indexOf(c.code)}"]`).classList.add('right');
      say(`아쉬워요. 이 국기는 ${c.name} 국기예요.`);
      setTimeout(showMap,3000);
    }
  });
}

function showMap(){
  const c=C[P.list[P.idx]];
  const opts=shuffle([c.code,...sample(pool().filter(x=>x!==c.code),P.n-1)]);
  const q=`${eunNeun(c.name)} 어디에 있을까요?`;
  $('#app').innerHTML = playBar()+`
    <div class="ask"><img src="${c.flag}" alt="${c.name} 국기"><h2>${esc(q)}</h2><button class="speak" id="sp" aria-label="다시 듣기">${ICON.speak}</button></div>
    <div class="map-wrap">${mapSVG(opts)}</div>
    <div class="num-row">${opts.map((_,i)=>`<button data-i="${i}" style="background:${OPT_COLORS[i]}">${i+1}</button>`).join('')}</div>`;
  bindBar();
  say(q); $('#sp').onclick=()=>say(q);
  let locked=false;
  const pick=i=>{
    if(locked) return;
    if(opts[i]===c.code){
      locked=true; sfx.good(); burst();
      if(P.f.map){ S.stars++; P.earned++; save(); }
      document.querySelectorAll('.map-wrap .opt').forEach(g=>{ if(+g.dataset.i!==i) g.classList.add('gone'); else g.classList.add('win'); });
      document.querySelectorAll('.num-row button').forEach(b=>{ if(+b.dataset.i!==i) b.classList.add('gone'); });
      say(`맞아요! ${eunNeun(c.name)} 여기에 있어요.`);
      setTimeout(showCapital,2600);
    } else {
      locked=true; P.f.map=false; sfx.soft();
      const ri=opts.indexOf(c.code);
      document.querySelectorAll('.map-wrap .opt').forEach(g=>{ if(+g.dataset.i!==ri) g.classList.add('gone'); else g.classList.add('win'); });
      document.querySelectorAll('.num-row button').forEach(x=>{ if(+x.dataset.i!==ri) x.classList.add('gone'); });
      say(`아쉬워요. 거기는 ${ieyo(C[opts[i]].name)}. ${eunNeun(c.name)} 여기에 있어요.`);
      setTimeout(showCapital,3600);
    }
  };
  document.querySelectorAll('.map-wrap .opt, .num-row button').forEach(el=>el.addEventListener('click',()=>pick(+el.dataset.i)));
}

function capitalOptions(c,n,withTrap){
  const others = pool().filter(x=>x!==c.code).map(x=>C[x].capital);
  let picks = [];
  if(withTrap && c.traps.length && Math.random()<0.7) picks.push(c.traps[Math.floor(Math.random()*c.traps.length)]);
  picks = picks.concat(sample(others,n-1-picks.length));
  return shuffle([c.capital,...picks]);
}
function choicesHTML(labels){
  const cls = labels.length===3?'choices n3':'choices';
  return `<div class="${cls}">${labels.map((l,i)=>`<button class="choice" data-i="${i}"><span class="no" style="background:${OPT_COLORS[i]}">${i+1}</span>${esc(l)}<span class="hear" data-hear="${i}" role="button" aria-label="${esc(l)} 듣기">${ICON.speak}</span></button>`).join('')}</div>`;
}
function readOptions(q,labels){ say(q); }
function bindChoices(labels,onPick){
  document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',e=>{
    const h=e.target.closest('[data-hear]');
    if(h){ e.stopPropagation(); say(labels[+h.dataset.hear]); return; }
    onPick(+b.dataset.i,b);
  }));
}

function showCapital(){
  const c=C[P.list[P.idx]];
  const labels=capitalOptions(c,P.n,P.n>=3);
  const q=`${c.name}의 수도는 어디일까요?`;
  $('#app').innerHTML = playBar()+`
    <div class="ask"><img src="${c.flag}" alt="${c.name} 국기"><h2>${esc(q)}</h2><button class="speak" id="sp" aria-label="다시 듣기">${ICON.speak}</button></div>
    ${choicesHTML(labels)}`;
  bindBar();
  readOptions(q,labels); $('#sp').onclick=()=>readOptions(q,labels);
  let locked=false;
  bindChoices(labels,(i,b)=>{
    if(locked) return;
    locked=true;
    const ok=labels[i]===c.capital;
    if(!ok){
      P.f.cap=false; sfx.soft(); b.classList.add('wrong');
      document.querySelector(`.choice[data-i="${labels.indexOf(c.capital)}"]`).classList.add('right');
    }
    {
      if(ok){ sfx.good(); burst(); b.classList.add('right'); S.stars++; P.earned++; save(); }
      const all = P.f.name&&P.f.map&&P.f.cap;
      P.results[P.idx]=all;
      const k=K(P.tier), firstLight = all && !(k[c.code]>=1);
      if(all){ k[c.code]=(k[c.code]||0)+1; save(); }
      const next=()=>{ P.idx++; if(P.idx<P.list.length) showName(); else roundDone(); };
      if(firstLight){
        say(`맞아요! ${c.name}의 수도는 ${ieyo(c.capital)}. 세 개 다 맞혔어요!`);
        setTimeout(()=>showTreasure(c,P.tier,next),2800);
      } else {
        const isTrap=!ok && c.traps.includes(labels[i]);
        const head = ok ? `맞아요! ${c.name}의 수도는 ${ieyo(c.capital)}.`
          : (isTrap ? `아쉬워요. ${eunNeun(labels[i])} 큰 도시지만 수도는 아니에요. ${c.name}의 수도는 ${ieyo(c.capital)}.`
                    : `아쉬워요. ${c.name}의 수도는 ${ieyo(c.capital)}.`);
        say(head+(all?'':' 이름, 위치, 수도를 다 맞히면 국기에 불이 켜져요.'));
        setTimeout(next, ok?3200:4800);
      }
    }
  });
}

function treasureCard(code,t,big){
  const c=C[code], [kind,name]=TREASURE[code][t-1], img=IMG[`t_${code}_${t}`];
  return `<div class="tcard t${t} ${big?'big':''}">
    <div class="tpic">${img?`<img src="${img}" alt="${esc(name)}">`:`<img class="tflag" src="${c.flag}" alt=""><span>${esc(name)}</span>`}</div>
    <div class="tname">${esc(name)}</div>
    <div class="tkind"><img src="${c.flag}" alt="">${c.name} · ${kind}</div>
  </div>`;
}
function treasureLine(code,t){
  const c=C[code], [kind,name]=TREASURE[code][t-1];
  if(kind==='유명한 곳') return `${c.name}의 유명한 곳, ${ieyo(name)}.`;
  if(kind==='음식') return `${c.name}의 대표 음식, ${ieyo(name)}.`;
  if(kind==='전통 옷') return `${c.name}의 전통 옷, ${ieyo(name)}.`;
  return `${c.name}${hasBatchim(c.name)?'을':'를'} 대표하는 ${kind}, ${ieyo(name)}.`;
}
// 카드 뒷면 → 누르면 빛이 번쩍 → 뒤집히며 "짜잔!"
const tkey=(code,t)=>code+'_'+t;
function flipCardHTML(code,t){
  return `<button class="flip t${t}" aria-label="보물 카드 열기">
    <span class="light" aria-hidden="true"></span>
    <span class="flip-inner">
      <span class="face back"><span class="bstars">${'★'.repeat(t)}</span><span class="bq">?</span><span class="bhint">눌러 보세요</span></span>
      <span class="face front">${treasureCard(code,t,true)}</span>
    </span></button>
    <div class="desc" hidden><p>${esc(DESC[code][t-1])}</p></div>
    <p class="tap-hint" hidden>카드를 누르면 설명이 나와요</p>`;
}
function sparkle(){ tone([[1047,.08],[1319,.08],[1568,.08],[2093,.25]]); }
function showDesc(root,code,t){
  const d=root.querySelector('.desc'), h=root.querySelector('.tap-hint');
  if(h) h.hidden=true;
  d.hidden=false; d.classList.remove('pop'); void d.offsetWidth; d.classList.add('pop');
  sfx.tap(); say(DESC[code][t-1]);
}
function bindFlip(root,code,t,onOpen,alreadyOpen){
  const b=root.querySelector('.flip'); let done=!!alreadyOpen;
  if(done){ b.classList.add('open','still'); }
  b.onclick=()=>{
    if(done){ showDesc(root,code,t); return; }
    done=true;
    const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
    b.classList.add('glow'); sparkle(); say('반짝반짝!');
    setTimeout(()=>{
      b.classList.add('open'); sfx.win(); burst();
      S.opened[tkey(code,t)]=true; save();
      say(`짜잔! ${treasureLine(code,t)}`);
      setTimeout(()=>{ const h=root.querySelector('.tap-hint'); if(h) h.hidden=false; },900);
      onOpen&&onOpen();
    }, still?100:900);
  };
}
function showTreasure(c,t,next){
  sfx.good();
  $('#app').innerHTML = playBar()+`
    <div class="intro treasure">
      <div class="eyebrow">보물 카드를 받았어요!</div>
      ${flipCardHTML(c.code,t)}
      <div class="row" id="after" hidden><button class="speak" id="sp" aria-label="다시 듣기">${ICON.speak}</button><button class="big-btn" id="nx">좋아요 ▶</button></div>
    </div>`;

    setTimeout(()=>{ $('#after').hidden=false; },700);

function openReveal(code,t,onClose,opened){

function openBook(){

    const got=TIERS.reduce((n,t)=>n+learnedCount(t),0);

      <div class="shop-head sticky"><h3>보물 카드</h3><b class="book-count">${got} / ${LV().list.length*3}</b><button class="x-btn" aria-label="닫기">${ICON.x}</button></div>
      <p class="note">★ 음식 · ★★ 옷·동물·물건 · ★★★ 유명한 곳. 나라 이름, 위치, 수도를 한 번에 다 맞히면 받아요.${closed?` 아직 안 연 카드가 ${closed}장 있어요!`:''}</p>

  };
  const close=()=>{ el.remove(); try{speechSynthesis.cancel();}catch(e){} renderHome(); };

function roundDone(){
  sfx.win(); burst();
  const t=P.tier, total=LV().list.length, now=learnedCount(t), gained=now-P.before;
  const justFinished = P.before<LV().need && now>=LV().need;   // 이번 판으로 이 별 단계 통과
  const names=['','하나','두 개','세 개'];
  let msg, btn;
  if(justFinished && t<3){ msg=`별 ${names[t]} 단계 통과! 별 ${names[t+1]} 단계가 열렸어요.`; btn=`<button class="big-btn sun" id="nx">${'★'.repeat(t+1)} 단계 가기</button>`; }
  else if(justFinished && t===3){ msg='별 세 개 단계까지 통과했어요! 이제 통과 테스트에 도전해 볼까요?'; btn=`<button class="big-btn sun" id="nx">통과 테스트 하러 가기</button>`; }
  else { msg=`잘했어요! 별을 ${P.earned}개 모았어요.`+(gained>0?` 새로 맞힌 나라가 ${gained}개예요.`:''); btn=`<button class="big-btn" id="nx">한 판 더 ▶</button>`; }
  $('#app').innerHTML = playBar()+`
    <div class="intro result">
      <h2>${justFinished?'단계 완료!':'한 판 끝!'}</h2>
      <div class="score">${ICON.star.replace('<svg','<svg width="60" height="60"')} ${P.earned}</div>
      <div class="cont">${'★'.repeat(t)} 단계에서 맞힌 나라 ${now} / ${total}</div>
      <div class="row">${btn}<button class="big-btn plain" id="hm">처음으로</button></div>
    </div>`;
  bindBar();
  say(msg);
  $('#nx').onclick=()=>{
    if(justFinished && t<3){ S.tier=t+1; save(); startRound(); }
    else if(justFinished){ P=null; renderHome(); }
    else startRound();
  };
  $('#hm').onclick=()=>{ P=null; renderHome(); };
}

// ===== 통과 테스트 (15문제, 4지선다, 국기·위치·수도 섞기) =====
function startTest(){
  if(testLocked()) return;
  const codes=sample(pool(),TEST_SIZE);
  const types=shuffle(Array.from({length:TEST_SIZE},(_,k)=>['flag','map','capital'][k%3]));
  P={ mode:'test', qs:codes.map((code,k)=>({code,type:types[k]})), idx:0, right:0, missed:[] };
  say('통과 테스트를 시작해요. 열다섯 문제예요. 천천히 골라 보세요.');
  setTimeout(showTestQ,2600);
}
function showTestQ(){
  const {code,type}=P.qs[P.idx], c=C[code];
  const answer=ok=>{
    sfx.tap();
    if(ok) P.right++; else P.missed.push(code);
    P.idx++;
    setTimeout(()=>{ if(P.idx<P.qs.length) showTestQ(); else testDone(); },350);
  };
  if(type==='map'){
    const opts=shuffle([code,...sample(pool().filter(x=>x!==code),3)]);
    const q=`${eunNeun(c.name)} 어디에 있을까요?`;
    $('#app').innerHTML=playBar()+`
      <div class="ask"><img src="${c.flag}" alt="${c.name} 국기"><h2>${esc(q)}</h2><button class="speak" id="sp" aria-label="다시 듣기">${ICON.speak}</button></div>
      <div class="map-wrap">${mapSVG(opts)}</div>
      <div class="num-row">${opts.map((_,i)=>`<button data-i="${i}" style="background:${OPT_COLORS[i]}">${i+1}</button>`).join('')}</div>`;
    say(q); $('#sp').onclick=()=>say(q);
    let done=false;
    document.querySelectorAll('.map-wrap .opt, .num-row button').forEach(el=>el.addEventListener('click',()=>{ if(done)return; done=true; answer(opts[+el.dataset.i]===code); }));
  } else {
    let labels,q,correct,showName;
    if(type==='flag'){
      const opts=shuffle([code,...sample(pool().filter(x=>x!==code),3)]);
      labels=opts.map(x=>C[x].name); correct=c.name; q='이 국기는 어느 나라일까요?'; showName=false;
    } else {
      labels=capitalOptions(c,4,true); correct=c.capital; q=`${c.name}의 수도는 어디일까요?`; showName=true;
    }
    $('#app').innerHTML=playBar()+`
      <div class="ask"><img src="${c.flag}" alt="${showName?c.name+' 국기':'국기'}" style="${type==='flag'?'height:110px':''}"><h2>${esc(q)}</h2><button class="speak" id="sp" aria-label="다시 듣기">${ICON.speak}</button></div>
      ${choicesHTML(labels)}`;
    readOptions(q,labels); $('#sp').onclick=()=>readOptions(q,labels);
    let done=false;
    bindChoices(labels,(i,b)=>{ if(done)return; done=true; b.classList.add('pick'); answer(labels[i]===correct); });
  }
  bindBar();
}
function testDone(){
  const lv=S.level, prize=STYLES.find(x=>x.need===lv&&AVATAR_IMG[x.id]);
  const pass=P.right>=S.passMark, firstPass=pass&&!S.passed[lv];
  if(pass){ if(firstPass){ S.passed[lv]=true; S.stars+=10; } S.testLock[lv]=null; }
  else S.testLock[lv]=today();
  const nextLv={A:'B',B:'C'}[lv], prizeTxt = prize ? prize.name : '';
  const openTxt = nextLv && LEVELS[nextLv] ? `${nextLv} 레벨이 열렸어요!` : '';
  save();
  if(pass){ sfx.win(); burst(); setTimeout(burst,400); } else sfx.soft();
  const missed=[...new Set(P.missed)];
  $('#app').innerHTML=playBar()+`
    <div class="intro result">
      <h2>${pass?`${lv} 레벨 통과!`:'아깝다! 내일 다시 도전!'}</h2>
      <div class="score">${P.right}<small> / ${P.qs.length}</small></div>
      <div class="cont">${pass?(firstPass?`별 10개${prizeTxt?'와 '+prizeTxt:''}을 받았어요. ${openTxt}`:'이번에도 통과했어요'):`${S.passMark}개를 맞히면 통과예요. 오늘은 공부 단계를 더 해 봐요.`}</div>
      ${missed.length?`<h3 style="font-size:22px">다시 보면 좋은 나라</h3><div class="review">${missed.map(x=>`<button data-c="${x}"><img src="${C[x].flag}" alt=""><span>${C[x].name}</span><small>수도 ${C[x].capital}</small></button>`).join('')}</div>`:''}
      <button class="big-btn" id="hm">처음으로</button>
    </div>`;
  bindBar();
  say(pass?(firstPass?`축하해요! ${lv} 레벨을 통과했어요! ${P.qs.length}문제 중에 ${P.right}개를 맞혔어요. ${prizeTxt?prizeTxt+'을 입을 수 있어요. ':''}${openTxt}`:`${P.right}개를 맞혔어요. 또 통과했어요!`)
          :`${P.qs.length}문제 중에 ${P.right}개를 맞혔어요. 아깝다! 내일 다시 도전해요.`);
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ const c=C[b.dataset.c]; say(`${c.name}. 수도는 ${ieyo(c.capital)}.`); });
  $('#hm').onclick=()=>{ P=null; renderHome(); };
}

renderHome();
</script>

<script>
if('serviceWorker' in navigator){
  const hadCtrl = !!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadCtrl && !reloaded){ reloaded=true; location.reload(); } });
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}); });
}
</script>
</body>
